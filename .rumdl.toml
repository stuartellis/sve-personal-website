# rumdl configuration file
#
# https://rumdl.dev/

[global]
exclude = [
    ".git",
    "LICENSES",
    "public",
    "LICENSE.md"
]
flavor = "gfm"
line-length = 120
respect-gitignore = true

[code-block-tools]
enabled = true

[code-block-tools.languages]
python = { lint = ["ruff:check"], format = ["ruff:format"] }
shell = { lint = ["shellcheck"], format = ["shfmt"] }

[MD004]
style = "dash"

[MD013]
reflow = true
reflow-mode = "normalize"

[per-file-flavor]
"docs/**/*.md" = "hugo"
